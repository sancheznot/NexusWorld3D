# Reproducible checks, build and disposable database integration.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: check:phase1
        run: npm run check:phase1
      - name: Regression tests
        run: npm test
      - name: Global lint
        run: npm run lint
      - name: Required demo assets
        run: npm run validate-required-models -- --tier=demo --strict && npm run validate-build-assets
      - name: Production build
        run: npm run build
      - name: Start isolated integration database
        run: docker compose -p nexus-phase-validation -f compose.validation.yml up -d --wait
      - name: Identity and persistence integration
        run: timeout 60s env NEXUS_RUN_ISOLATED_DB_TESTS=1 npm run test:integration
      - name: Remove disposable integration database
        if: always()
        run: docker compose -p nexus-phase-validation -f compose.validation.yml down
